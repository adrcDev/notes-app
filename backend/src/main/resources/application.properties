spring.application.name=notes app backend

#Embedded apache tomcat web server config
server.port=${PORT:8080}

# DataSource config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

#HikariCP DataSource's settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=MyHikariCP

# JPA and hibernate specific settings
#=======================================
# 'none' is the default value, use 'validate' to tell hibernate to check your entity classes against the
# respective database tables
#========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

#==============================================
# Not you can tell spring web mvc to use other locations on file system for static file serving by making use
# this application property and a value using 'file:' syntax eg: file:uploads/ (will use a uploads folder that
# is present in root of project directory)
#==============================================
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/


